name: Deploy Roomie

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml

  package:
    name: Package release
    needs: tests
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || vars.ROOMIE_AUTO_DEPLOY == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      artifact-id: ${{ steps.release.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Build Lambda ZIP
        run: |
          infra/build-lambda.sh
          unzip -tq infra/build/roomie-lambda.zip
      - name: Build production frontend
        working-directory: frontend
        env:
          VITE_API_BASE_URL: /api/v1
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
        run: |
          if [[ ! "$VITE_GOOGLE_CLIENT_ID" =~ ^[a-zA-Z0-9_-]+\.apps\.googleusercontent\.com$ ]]; then
            echo 'Set VITE_GOOGLE_CLIENT_ID to the public Google Web client ID in repository Actions variables.' >&2
            exit 1
          fi
          npm ci
          npm run build
      - name: Stage release files
        run: |
          mkdir -p "$RUNNER_TEMP/roomie-release"
          cp infra/build/roomie-lambda.zip "$RUNNER_TEMP/roomie-release/"
          cp -R frontend/dist "$RUNNER_TEMP/roomie-release/frontend"
      - name: Archive release
        id: release
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: roomie-release-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/roomie-release/
          if-no-files-found: error
          retention-days: 30

  deploy:
    name: Deploy production
    needs: package
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment:
      name: production
      url: ${{ vars.ROOMIE_SITE_URL }}
    env:
      ROOMIE_DISTRIBUTION_ID: ${{ vars.ROOMIE_DISTRIBUTION_ID }}
    concurrency:
      group: roomie-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.package.outputs.artifact-id }}
          path: ${{ runner.temp }}/roomie-release
      - name: Verify main commit and production deployment settings
        id: main-tip
        env:
          GH_TOKEN: ${{ github.token }}
          ROOMIE_AWS_ACCOUNT_ID: ${{ vars.ROOMIE_AWS_ACCOUNT_ID }}
          ROOMIE_DEPLOY_ROLE_ARN: ${{ vars.ROOMIE_DEPLOY_ROLE_ARN }}
        run: |
          main_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [[ "$main_sha" == "$GITHUB_SHA" ]]; then
            if [[ "$ROOMIE_DISTRIBUTION_ID" != E2B2AJ4RCN6CN7 ]]; then
              printf 'ROOMIE_DISTRIBUTION_ID mismatch: expected E2B2AJ4RCN6CN7, got %q (%d characters).\n' \
                "$ROOMIE_DISTRIBUTION_ID" "${#ROOMIE_DISTRIBUTION_ID}" >&2
              exit 1
            fi
            if [[ ! "$ROOMIE_AWS_ACCOUNT_ID" =~ ^[0-9]{12}$ ||
                  "$ROOMIE_DEPLOY_ROLE_ARN" != arn:aws:iam::"$ROOMIE_AWS_ACCOUNT_ID":role/* ]]; then
              echo 'Set the production AWS account ID and a deployment role ARN in that account.' >&2
              exit 1
            fi
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Skipping a superseded main commit.'
          fi
      - name: Authenticate to AWS via GitHub OIDC
        if: steps.main-tip.outputs.current == 'true'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.ROOMIE_DEPLOY_ROLE_ARN }}
          aws-region: eu-central-1
          audience: sts.amazonaws.com
          allowed-account-ids: ${{ vars.ROOMIE_AWS_ACCOUNT_ID }}
          role-session-name: roomie-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Release and smoke test
        if: steps.main-tip.outputs.current == 'true'
        env:
          ROOMIE_LAMBDA_FUNCTION: ${{ vars.ROOMIE_LAMBDA_FUNCTION }}
          ROOMIE_FRONTEND_BUCKET: ${{ vars.ROOMIE_FRONTEND_BUCKET }}
          ROOMIE_SITE_URL: ${{ vars.ROOMIE_SITE_URL }}
        run: bash infra/deploy-release.sh "$RUNNER_TEMP/roomie-release"
