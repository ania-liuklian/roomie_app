name: CI

on:
  pull_request:
    branches: [main]
  merge_group:
  workflow_call:

permissions:
  contents: read

jobs:
  sqlite:
    name: Backend SQLite
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install and test
        working-directory: backend
        run: |
          python -m pip install -r requirements.txt
          python -m pytest -q -rfs

  postgres:
    name: Backend PostgreSQL
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: roomie
          POSTGRES_USER: roomie
          POSTGRES_PASSWORD: roomie-ci-only
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U roomie -d roomie"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install and test
        working-directory: backend
        env:
          ROOMIE_TEST_POSTGRES_URL: postgresql+psycopg://roomie:roomie-ci-only@localhost:${{ job.services.postgres.ports['5432'] }}/roomie
        run: |
          python -m pip install -r requirements.txt
          python -m pytest -q -rfs

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install, test, typecheck and build
        env:
          VITE_API_BASE_URL: /api/v1
          VITE_GOOGLE_CLIENT_ID: ci-placeholder.apps.googleusercontent.com
        run: |
          npm ci
          node --test tests/*.test.mjs
          npm exec -- tsc --noEmit --noUnusedLocals --noUnusedParameters
          npm run build

  terraform:
    name: Terraform
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra
    env:
      TF_IN_AUTOMATION: 'true'
      AWS_EC2_METADATA_DISABLED: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: '1.16.2'
          terraform_wrapper: false
      - name: Format and validate without AWS access
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false -lockfile=readonly -no-color
          terraform validate -no-color
